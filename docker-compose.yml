services:
  api:
    build:
      context: ./services/api
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      vault:
        condition: service_started
      vault-bootstrap:
        condition: service_completed_successfully
      modelserver:
        condition: service_started
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN}
      MODELSERVER_URL: http://modelserver:8001
    volumes:
      - ./eval_thresholds.yaml:/eval_thresholds.yaml:ro
    ports:
      - "${API_PORT}:8000"

  modelserver:
    build:
      context: ./services/modelserver
    depends_on:
      minio:
        condition: service_started
      vault:
        condition: service_started
      vault-bootstrap:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN}
      MINIO_ENDPOINT: http://minio:9000
      MODEL_ARTIFACT_DIR: /models/distilbert_export
    volumes:
      - ./eval_thresholds.yaml:/eval_thresholds.yaml:ro
      - ./models:/models:ro
    ports:
      - "${MODELSERVER_PORT}:8001"

  chatbot:
    build:
      context: ./services/chatbot
    depends_on:
      api:
        condition: service_started
    environment:
      API_BASE_URL: http://api:8000/api/v1
    ports:
      - "${CHATBOT_PORT}:8501"

  widget:
    build:
      context: ./services/widget
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT}/api/v1
    ports:
      - "${WIDGET_PORT}:5173"

  host:
    build:
      context: ./services/host
    depends_on:
      widget:
        condition: service_started
    ports:
      - "${HOST_PORT}:80"

  migrate:
    build:
      context: ./services/api
    depends_on:
      db:
        condition: service_started
      vault:
        condition: service_started
      vault-bootstrap:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN}
    volumes:
      - ./eval_thresholds.yaml:/eval_thresholds.yaml:ro
    command: ["alembic", "upgrade", "head"]
    profiles: ["tools"]

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: maintainer_copilot
      POSTGRES_USER: maintainer_copilot
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  vault:
    image: hashicorp/vault:latest
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - ./infra/vault:/vault/bootstrap:ro

  vault-bootstrap:
    image: hashicorp/vault:latest
    depends_on:
      vault:
        condition: service_started
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./infra/vault:/vault/bootstrap:ro
    command: ["sh", "/vault/bootstrap/bootstrap.sh"]

volumes:
  db-data:
  redis-data:
  minio-data:
