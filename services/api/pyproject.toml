[project]
name = "maintainer-copilot-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi",
  "fastapi-users[sqlalchemy]",
  "sqlalchemy>=2",
  "psycopg[binary]",
  "alembic",
  "pgvector",
  "redis",
  "hvac",
  "minio",
  "anthropic",
  "sentence-transformers",
  "rank-bm25",
  "spacy",
  "opentelemetry-sdk",
  "opentelemetry-exporter-jaeger",
  "ragas",
  "apscheduler",
  "email-validator",
  "pydantic-settings",
  "pytest",
  "httpx",
  "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
