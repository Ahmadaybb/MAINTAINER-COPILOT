[project]
name = "maintainer-copilot-chatbot"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "streamlit",
  "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["app.py", "api_client.py", "pages"]
