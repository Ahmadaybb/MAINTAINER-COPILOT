[project]
name = "maintainer-copilot-modelserver"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi",
  "minio",
  "hvac",
  "transformers",
  "torch",
  "safetensors",
  "scikit-learn",
  "spacy",
  "opentelemetry-sdk",
  "pytest",
  "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
